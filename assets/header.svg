<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#F472B6;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#F472B6;#38BDF8;#818CF8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#F472B6;#38BDF8;#818CF8;#F472B6" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse-border {
      0% { stroke-opacity: 0.4; filter: drop-shadow(0 0 4px #38BDF8); }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 15px #EC4899); }
      100% { stroke-opacity: 0.4; filter: drop-shadow(0 0 4px #38BDF8); }
    }
    @keyframes float-particle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .main-title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 42px;
      fill: url(#text-grad);
      letter-spacing: 4px;
    }
    .subtitle {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 16px;
      fill: #94A3B8;
      letter-spacing: 2px;
    }
    .badge-text {
      font-family: 'Fira Code', monospace, sans-serif;
      font-size: 12px;
      fill: #34D399;
      font-weight: 600;
    }
    .particle {
      animation: float-particle 5s ease-in-out infinite;
    }
    .border-rect {
      animation: pulse-border 4s ease-in-out infinite;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }
  </style>

  <!-- Background Card -->
  <rect width="846" height="236" x="2" y="2" rx="16" fill="url(#bg-grad)" />
  <rect width="846" height="236" x="2" y="2" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="2" class="border-rect" />

  <!-- Animated Floating Particles -->
  <circle cx="90" cy="50" r="3" fill="#38BDF8" class="particle" style="animation-delay: 0s;" />
  <circle cx="760" cy="70" r="4" fill="#F472B6" class="particle" style="animation-delay: 1.5s;" />
  <circle cx="180" cy="190" r="3" fill="#818CF8" class="particle" style="animation-delay: 2.5s;" />
  <circle cx="690" cy="200" r="3" fill="#34D399" class="particle" style="animation-delay: 0.8s;" />

  <!-- Status Badge -->
  <g transform="translate(635, 28)">
    <rect width="180" height="32" rx="16" fill="#064E3B" fill-opacity="0.6" stroke="#10B981" stroke-width="1.5" />
    <circle cx="22" cy="16" r="5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="21" class="badge-text">● ALWAYS CODING</text>
  </g>

  <!-- Main Content -->
  <g transform="translate(45, 105)">
    <text class="main-title" filter="url(#glow)">ADITYA RATHOD</text>
    <text y="42" class="subtitle">⚡ FULL-STACK DEVELOPER &amp; UI/UX CRAFTSMAN ⚡</text>
    <text y="72" font-family="'Fira Code', monospace" font-size="13" fill="#64748B">
      &gt; Building ultra-fast, animated &amp; responsive web applications<tspan class="cursor" fill="#38BDF8">_</tspan>
    </text>
  </g>
</svg>
